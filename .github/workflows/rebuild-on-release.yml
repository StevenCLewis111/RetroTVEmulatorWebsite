name: Rebuild Website on Release

on:
  release:
    types: [published, edited]
  workflow_dispatch:

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger GitHub Pages Deployment
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.REBUILD_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://github.com \
            -d '{"ref":"main"}'

